name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Only the tests that run without a LogicMonitor portal are run here. The rest of the
    # suite drives a live portal using credentials held in user secrets, which CI does not
    # have, so `dotnet test` over the whole suite can never pass. Those are run locally.
    #
    # The test project is excluded from the Release|Any CPU solution configuration (see
    # LogicMonitor.Api.slnx) and is x64-only, so the solution build above does not produce
    # it - it has to be built explicitly.
    - name: Build tests
      run: dotnet build LogicMonitor.Api.Test/LogicMonitor.Api.Test.csproj --configuration Release

    - name: Portal-free unit tests
      run: >-
        dotnet run --project LogicMonitor.Api.Test/LogicMonitor.Api.Test.csproj
        --configuration Release --no-build --
        -class LogicMonitor.Api.Test.Alerts.AlertFilterGetFilterTests
        -class LogicMonitor.Api.Test.Alerts.EscalationChainCreationDtoSerializationTests
        -class LogicMonitor.Api.Test.Attributes.IsPropertyReadonlyTests
        -class LogicMonitor.Api.Test.Converters.DoubleOrNAConverterTests
        -class LogicMonitor.Api.Test.Converters.PolymorphicConverterMessageTests
        -class LogicMonitor.Api.Test.Converters.TolerantStringEnumConverterTests
        -class LogicMonitor.Api.Test.Data.LineTests
        -class LogicMonitor.Api.Test.EventLogs.AuditEventTests
        -class LogicMonitor.Api.Test.EventLogs.OversizedDescriptionTests
        -class LogicMonitor.Api.Test.Extensions.DateTimeExtensionTests
        -class LogicMonitor.Api.Test.Filters.FilterItemTests
        -class LogicMonitor.Api.Test.LogicModules.AppliesToFunctionCidrTests
        -class LogicMonitor.Api.Test.PortalResponseTests
        -class LogicMonitor.Api.Test.Resources.EntityPropertyWriteTests
        -class LogicMonitor.Api.Test.Topologies.TopologyDataDeserializationTests
        -class LogicMonitor.Api.Test.UptimeResources.UptimeResourceSerializationTests
        -noColor

    - name: Pack
      run: dotnet pack LogicMonitor.Api/LogicMonitor.Api.csproj --configuration Release --no-build --output ./artifacts

    # The .snupkg has to travel with the .nupkg: `dotnet nuget push` picks up the symbol
    # package from alongside the package it is pushing, so dropping it here would silently
    # publish without symbols.
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Login to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: david_n_m_bond

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # Test coverage, uploaded to Codacy (OPS-157454).
  #
  # pdl-public, never a GitHub-hosted runner. This repository is public, and pdl-public is the
  # hardened scale set that may serve one: no dind, no privileged container, no hostPath.
  coverage:
    runs-on: [pdl-public]

    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: the actions-runner image our scale sets use does not offer
    # the Node version several of these actions request by default, and without it they fail before
    # their first step runs.
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        # The runner user cannot write the default /usr/share/dotnet, so install the SDK somewhere
        # it can. setup-dotnet puts this directory on PATH for the later steps.
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.x

    - name: Build tests
      run: dotnet build LogicMonitor.Api.Test/LogicMonitor.Api.Test.csproj --configuration Debug

    # Coverage is collected by Microsoft.Testing.Extensions.CodeCoverage. The build job runs this project
    # with xunit-native arguments (-class ...), so it is not switched to the MTP runner; instead
    # "dotnet test" with the options after "--" runs the tests on Microsoft.Testing.Platform
    # without changing the project. The report is written to TestResults/Coverage.
    #
    # CI runs only the tests that need no credentials. Everything deriving from TestWithOutput drives a
    # live LogicMonitor portal with credentials from user secrets, which CI does not have, and
    # xunit.runner.json sets failSkips: true, so those tests are tagged Category=Integration and
    # filtered out here. This runs every portal-free test, not only the classes the build job lists.
    - name: Run tests with coverage
      run: >-
        dotnet test LogicMonitor.Api.Test/LogicMonitor.Api.Test.csproj
        --configuration Debug --no-build
        --
        --filter-not-trait "Category=Integration"
        --coverage
        --coverage-settings "$GITHUB_WORKSPACE/coverage.config"
        --coverage-output-format cobertura
        --coverage-output coverage.cobertura.xml
        --results-directory "$GITHUB_WORKSPACE/TestResults/Coverage"

    # continue-on-error: a Codacy outage must not turn a passing test run red. The trade-off is that
    # an expired project token fails silently, so check the log for "Coverage received successfully".
    - name: Upload coverage to Codacy
      continue-on-error: true
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: TestResults/Coverage/coverage.cobertura.xml

    - name: Upload coverage artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: TestResults/Coverage/coverage.cobertura.xml
        retention-days: 7
